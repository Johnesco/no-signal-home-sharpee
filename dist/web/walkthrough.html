<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Signal Home - Walkthrough Viewer</title>
  <style>
    /* --- Reset & tokens (sci-fi terminal theme) --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #0a0a0e;
      --color-text: #cccccc;
      --color-muted: #667766;
      --color-accent: #33ff33;
      --color-accent-hover: #44ff44;
      --color-border: #1a3a1a;
      --color-surface: #0d0d12;
      --color-amber: #ffaa00;
      --color-red: #ff3333;
      --color-cyan: #00cccc;
    }

    body {
      font-family: 'Consolas', 'Courier New', monospace;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
    }

    /* --- Viewer wrapper --- */
    .viewer-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .viewer-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    .viewer-header h1 {
      font-size: 1.4rem;
      color: var(--color-accent);
      margin-bottom: 0.25rem;
    }

    .viewer-subtitle {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 0.75rem;
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--color-muted);
    }

    .stat-value {
      font-weight: 700;
      color: var(--color-text);
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.1rem 0.5rem;
      border-radius: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-pass { background: #0a3a0a; color: var(--color-accent); border: 1px solid #1a5a1a; }
    .badge-fail { background: #3a0a0a; color: var(--color-red); border: 1px solid #5a1a1a; }
    .badge-blank { background: #3a2a0a; color: var(--color-amber); border: 1px solid #5a3a1a; }

    /* --- Layout --- */
    .viewer-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
      height: calc(100vh - 240px);
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--color-surface);
    }

    .sidebar-heading {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      padding: 0.75rem 1rem 0.5rem;
    }

    .transcript-list {
      list-style: none;
      flex: 1;
      overflow-y: auto;
    }

    .transcript-item {
      padding: 0.6rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid var(--color-border);
      transition: background 0.12s;
    }

    .transcript-item:hover { background: #111118; }

    .transcript-item.active {
      background: #0a1a0a;
      border-left: 3px solid var(--color-accent);
    }

    .transcript-item .name {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.1rem;
      color: var(--color-text);
    }

    .transcript-item .meta {
      font-size: 0.7rem;
      color: var(--color-muted);
    }

    /* --- Filter bar --- */
    .filter-bar {
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.8rem;
      flex-shrink: 0;
      background: var(--color-surface);
    }

    .filter-bar label {
      color: var(--color-muted);
      font-size: 0.75rem;
    }

    .filter-bar select {
      background: var(--color-bg);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 4px;
      font-family: inherit;
    }

    /* --- Main content --- */
    .viewer-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .turns-container {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 1rem;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--color-muted);
      font-size: 0.9rem;
    }

    /* --- Section headers --- */
    .section-header {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-accent);
      padding: 0.75rem 0 0.35rem;
      margin-top: 0.5rem;
      border-bottom: 1px solid var(--color-border);
    }

    .section-header:first-child { margin-top: 0; }

    /* --- Turn cards --- */
    .turn-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 3px solid var(--color-border);
      margin-bottom: 2px;
      border-radius: 4px;
    }

    .turn-card.fail { border-left-color: var(--color-red); }
    .turn-card.blank { border-left-color: var(--color-amber); }

    .turn-command {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.35rem 0.75rem;
    }

    .turn-number {
      font-size: 0.65rem;
      color: var(--color-muted);
      min-width: 24px;
    }

    .command {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text);
      flex: 1;
    }

    .command::before {
      content: '> ';
      color: var(--color-accent);
    }

    .result-badge {
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .result-pass { background: #0a3a0a; color: var(--color-accent); }
    .result-fail { background: #3a0a0a; color: var(--color-red); }
    .result-blank { background: #3a2a0a; color: var(--color-amber); }

    .game-turn-num {
      font-size: 0.65rem;
      color: var(--color-muted);
    }

    .output-block {
      padding: 0.25rem 0.75rem 0.5rem 3rem;
      font-size: 0.78rem;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--color-muted);
      font-family: 'Consolas', 'Courier New', monospace;
    }

    /* --- Assertions --- */
    .assertions-block {
      padding: 0.15rem 0.75rem 0.25rem 3rem;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .assertion-chip {
      font-size: 0.6rem;
      padding: 0.05rem 0.35rem;
      border-radius: 2px;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    .assertion-pass { background: #0a3a0a; color: var(--color-accent); }
    .assertion-fail { background: #3a0a0a; color: var(--color-red); }
    .assertion-blank { background: #3a2a0a; color: var(--color-amber); }

    /* --- Events toggle --- */
    .events-toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.75rem 0.25rem 3rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.7rem;
      color: var(--color-muted);
      transition: color 0.12s;
    }

    .events-toggle:hover { color: var(--color-text); }

    .events-toggle .arrow {
      transition: transform 0.15s;
      display: inline-block;
      font-size: 0.6rem;
    }

    .events-toggle.open .arrow { transform: rotate(90deg); }

    .event-badges-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
    }

    .event-badge-small {
      font-size: 0.6rem;
      padding: 0.05rem 0.3rem;
      border-radius: 2px;
      background: #1a1a2e;
      color: var(--color-muted);
    }

    /* --- Events section --- */
    .events-section {
      display: none;
      padding: 0.4rem 0.75rem 0.5rem 3rem;
      border-top: 1px solid var(--color-border);
    }

    .events-section.open { display: block; }

    .event-item { margin-bottom: 2px; }

    .event-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s;
    }

    .event-header:hover { background: #111118; }

    .event-type-badge {
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-weight: 600;
      white-space: nowrap;
      color: #fff;
    }

    .etype-action   { background: #166534; }
    .etype-movement { background: #1e40af; }
    .etype-message  { background: #6b21a8; }
    .etype-death    { background: #991b1b; }
    .etype-game     { background: #c2410c; }
    .etype-npc      { background: #0e7490; }
    .etype-state    { background: #3f6212; }
    .etype-score    { background: #ca8a04; color: #111; }

    .event-summary {
      font-size: 0.72rem;
      color: var(--color-muted);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-expand {
      font-size: 0.6rem;
      color: var(--color-muted);
      transition: transform 0.15s;
    }

    .event-json {
      display: none;
      margin: 0.25rem 0.5rem 0.5rem;
      padding: 0.6rem;
      background: #0a0a0e;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-size: 0.72rem;
      font-family: 'Consolas', 'Courier New', monospace;
      line-height: 1.5;
      overflow-x: auto;
      max-height: 300px;
      overflow-y: auto;
    }

    .event-json.open { display: block; }

    /* JSON syntax highlighting */
    .json-key    { color: var(--color-cyan); }
    .json-string { color: var(--color-accent); }
    .json-number { color: var(--color-amber); }
    .json-bool   { color: #aa66ff; }
    .json-null   { color: var(--color-red); }
    .json-brace  { color: var(--color-muted); }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .viewer-layout {
        flex-direction: column;
        height: auto;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        max-height: 200px;
      }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--color-bg); }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a5a2a; }
  </style>
</head>
<body>
  <div class="viewer-wrapper">
    <div class="viewer-header">
      <h1>No Signal Home &mdash; Walkthrough Viewer</h1>
      <p class="viewer-subtitle">Browse every command, game output, and domain event from test transcripts.</p>
      <div class="stats-bar" id="stats">Loading walkthrough data...</div>
    </div>

    <div class="viewer-layout">
      <nav class="sidebar">
        <h2 class="sidebar-heading">Transcripts</h2>
        <ul class="transcript-list" id="transcript-list"></ul>
      </nav>

      <div class="viewer-main">
        <div class="filter-bar">
          <label for="filter-event-type">Event type:</label>
          <select id="filter-event-type">
            <option value="">All</option>
          </select>
          <label for="filter-result">Result:</label>
          <select id="filter-result">
            <option value="">All</option>
            <option value="PASS">Pass</option>
            <option value="FAIL">Fail</option>
            <option value="BLANK">Blank</option>
          </select>
        </div>
        <div class="turns-container" id="turns-container">
          <div class="empty-state">Select a transcript to view turns</div>
        </div>
      </div>
    </div>
  </div>

<script>
  let viewerData = null;

  const state = {
    transcriptId: null,
    eventFilter: '',
    resultFilter: '',
  };

  function escHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function classifyEvent(type) {
    if (type.includes('death') || type.includes('killed')) return 'death';
    if (type.includes('moved') || type.includes('exited') || type.includes('entered')) return 'movement';
    if (type === 'game.message') return 'message';
    if (type.startsWith('game.')) return 'game';
    if (type.startsWith('npc.')) return 'npc';
    if (type.includes('score') || type.includes('victory')) return 'score';
    if (type.includes('sm.transition') || type.includes('state')) return 'state';
    return 'action';
  }

  function summarizeEvent(ev) {
    const d = ev.data || {};
    switch (ev.event_type) {
      case 'game.message':
        return d.text ? String(d.text).substring(0, 80) + (String(d.text).length > 80 ? '...' : '') : d.messageId || '';
      case 'if.event.actor_moved':
        return `${d.sourceRoom?.name || d.fromRoom || '?'} \u2192 ${d.destinationRoom?.name || d.toRoom || '?'}`;
      case 'if.event.actor_exited':
        return `${d.direction || ''} \u2192 ${d.toRoom || ''}`;
      case 'if.event.actor_entered':
        return `from ${d.fromRoom || '?'} (${d.direction || ''})`;
      case 'if.event.taken':
        return d.itemName || d.item || '';
      case 'if.event.dropped':
        return d.itemName || d.item || '';
      case 'if.event.opened':
      case 'if.event.closed':
        return d.targetName || d.target || '';
      case 'if.event.room.description':
        return d.roomName || d.room?.name || '';
      case 'game.victory':
        return `Score: ${d.totalScore || '?'}`;
      case 'sm.transition':
        return `${d.machineId || '?'}: ${d.from || '?'} \u2192 ${d.to || '?'}`;
      case 'npc.emoted':
        return d.messageId || '';
      default:
        return d.messageId || d.targetName || '';
    }
  }

  function syntaxHighlight(json) {
    return json.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?|[{}\[\],])/g,
      (match) => {
        let cls = 'json-number';
        if (/^"/.test(match)) {
          if (/:$/.test(match)) {
            cls = 'json-key';
            match = match.replace(/"/g, '').replace(/:$/, ':');
            return `<span class="${cls}">${escHtml(match)}</span>`;
          } else {
            cls = 'json-string';
          }
        } else if (/true|false/.test(match)) {
          cls = 'json-bool';
        } else if (/null/.test(match)) {
          cls = 'json-null';
        } else if (/[{}\[\],]/.test(match)) {
          cls = 'json-brace';
        }
        return `<span class="${cls}">${escHtml(match)}</span>`;
      }
    );
  }

  function highlightJson(obj) {
    return syntaxHighlight(JSON.stringify(obj, null, 2));
  }

  function transformTestResults(raw) {
    const transcripts = [];
    const turnsByTranscript = {};
    const eventsByTurn = {};
    const eventTypeCounts = {};
    let totalTurns = 0;
    let totalEvents = 0;
    let totalPassed = 0;
    let totalFailed = 0;
    let totalBlank = 0;
    let globalTurnId = 0;

    for (let tIdx = 0; tIdx < raw.transcripts.length; tIdx++) {
      const t = raw.transcripts[tIdx];
      const tId = tIdx + 1;

      transcripts.push({
        id: tId,
        filename: t.transcript.filePath,
        title: t.transcript.header.title || null,
        description: t.transcript.header.description || null,
        test_count: t.passed + t.failed + (t.skipped || 0),
        duration_ms: t.duration || null,
        sequence: tIdx + 1,
      });

      const commentsBefore = {};
      const items = t.transcript.items || [];
      let pendingComments = [];
      for (const item of items) {
        if (item.type === 'comment') {
          pendingComments.push(item.comment.text);
        } else if (item.type === 'command') {
          if (pendingComments.length > 0) {
            commentsBefore[item.command.lineNumber] = pendingComments;
            pendingComments = [];
          }
        }
      }

      const turns = [];
      for (let cIdx = 0; cIdx < t.commands.length; cIdx++) {
        const cmd = t.commands[cIdx];
        globalTurnId++;
        totalTurns++;

        const passed = cmd.passed !== false;
        const isBlank = cmd.assertionResults
          ? cmd.assertionResults.some(a => a.assertion.type === 'auto-blank-check' && !a.passed)
          : (!cmd.actualOutput || !cmd.actualOutput.trim());
        if (passed) totalPassed++;
        else totalFailed++;
        if (isBlank) totalBlank++;

        let gameTurn = null;
        if (cmd.actualEvents && cmd.actualEvents.length > 0) {
          gameTurn = cmd.actualEvents[0].data?.turn || null;
        }

        const lineNum = cmd.command.lineNumber;
        const sections = commentsBefore[lineNum] || [];

        turns.push({
          id: globalTurnId,
          transcript_id: tId,
          sequence: cIdx + 1,
          command: cmd.command.input,
          result: passed ? 'PASS' : 'FAIL',
          assertion: cmd.assertionResults
            ? cmd.assertionResults.map(a =>
                `${a.assertion.type}: ${JSON.stringify(a.assertion.value)} ${a.passed ? 'PASS' : 'FAIL'}`
              ).join('; ')
            : null,
          assertionResults: cmd.assertionResults || [],
          output_text: cmd.actualOutput || null,
          game_turn: gameTurn,
          sections: sections,
          isBlank: isBlank,
        });

        const turnEvents = [];
        if (cmd.actualEvents) {
          for (let eIdx = 0; eIdx < cmd.actualEvents.length; eIdx++) {
            const ev = cmd.actualEvents[eIdx];
            totalEvents++;

            const eventType = ev.type || 'unknown';
            eventTypeCounts[eventType] = (eventTypeCounts[eventType] || 0) + 1;

            turnEvents.push({
              id: totalEvents,
              sequence: eIdx + 1,
              event_type: eventType,
              action_id: ev.data?.actionId || null,
              game_turn: ev.data?.turn || null,
              data: ev.data || {},
              entityTraits: ev.entityTraits || null,
            });
          }
        }
        eventsByTurn[globalTurnId] = turnEvents;
      }

      turnsByTranscript[tId] = turns;
    }

    const eventTypes = Object.entries(eventTypeCounts)
      .map(([event_type, count]) => ({ event_type, count }))
      .sort((a, b) => b.count - a.count);

    return {
      stats: {
        transcripts: transcripts.length,
        turns: totalTurns,
        events: totalEvents,
        passed: totalPassed,
        failed: totalFailed,
        blank: totalBlank,
      },
      transcripts,
      turnsByTranscript,
      eventsByTurn,
      eventTypes,
    };
  }

  function renderStats() {
    if (!viewerData) return;
    const s = viewerData.stats;
    document.getElementById('stats').innerHTML = `
      <span><span class="stat-value">${s.transcripts}</span> transcripts</span>
      <span><span class="stat-value">${s.turns}</span> turns</span>
      <span><span class="stat-value">${s.events}</span> events</span>
      <span class="badge badge-pass">${s.passed} pass</span>
      ${s.failed ? `<span class="badge badge-fail">${s.failed} fail</span>` : ''}
      ${s.blank ? `<span class="badge badge-blank">${s.blank} blank</span>` : ''}
    `;
  }

  function renderEventTypes() {
    if (!viewerData) return;
    const select = document.getElementById('filter-event-type');
    for (const t of viewerData.eventTypes) {
      const opt = document.createElement('option');
      opt.value = t.event_type;
      opt.textContent = `${t.event_type} (${t.count})`;
      select.appendChild(opt);
    }
  }

  function renderTranscripts() {
    if (!viewerData) return;
    const list = document.getElementById('transcript-list');
    list.innerHTML = '';
    for (const t of viewerData.transcripts) {
      const li = document.createElement('li');
      li.className = 'transcript-item';
      li.dataset.id = String(t.id);
      li.innerHTML = `
        <div class="name">${escHtml(t.title || t.filename)}</div>
        <div class="meta">${escHtml(t.filename)} &middot; ${t.test_count ?? '?'} tests${t.duration_ms != null ? ` &middot; ${t.duration_ms}ms` : ''}</div>
        ${t.description ? `<div class="meta" style="margin-top:2px;font-style:italic">${escHtml(t.description)}</div>` : ''}
      `;
      li.addEventListener('click', () => selectTranscript(t.id, li));
      list.appendChild(li);
    }

    if (viewerData.transcripts.length > 0) {
      const first = list.querySelector('.transcript-item');
      if (first) selectTranscript(viewerData.transcripts[0].id, first);
    }
  }

  function selectTranscript(id, el) {
    state.transcriptId = id;
    document.querySelectorAll('.transcript-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    renderTurns();
  }

  function renderTurns() {
    if (!viewerData || state.transcriptId === null) return;
    const container = document.getElementById('turns-container');
    const turns = viewerData.turnsByTranscript[state.transcriptId] || [];
    const filtered = turns.filter(t => {
      if (state.resultFilter === 'BLANK') return t.isBlank;
      if (state.resultFilter && t.result !== state.resultFilter) return false;
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state">No turns match filters</div>';
      return;
    }

    container.innerHTML = '';
    for (const turn of filtered) {
      if (turn.sections && turn.sections.length > 0) {
        for (const comment of turn.sections) {
          const header = document.createElement('div');
          header.className = 'section-header';
          header.textContent = comment.replace(/^#\s*/, '');
          container.appendChild(header);
        }
      }

      const events = viewerData.eventsByTurn[turn.id] || [];
      const eventTypes = [...new Set(events.map(e => e.event_type))];

      let assertionsHtml = '';
      if (turn.assertionResults && turn.assertionResults.length > 0) {
        const chips = turn.assertionResults.map(a => {
          const isBlankCheck = a.assertion.type === 'auto-blank-check';
          const cls = isBlankCheck
            ? (a.passed ? 'assertion-pass' : 'assertion-blank')
            : (a.passed ? 'assertion-pass' : 'assertion-fail');
          const icon = a.passed ? '\u2713' : '\u2717';
          const label = isBlankCheck ? 'blank-check' : a.assertion.type.replace('ok-', '');
          return `<span class="assertion-chip ${cls}">${icon} ${escHtml(label)}: ${escHtml(JSON.stringify(a.assertion.value))}</span>`;
        }).join('');
        assertionsHtml = `<div class="assertions-block">${chips}</div>`;
      }

      const cardClass = turn.isBlank ? 'blank' : (turn.result === 'FAIL' ? 'fail' : '');
      const card = document.createElement('div');
      card.className = `turn-card${cardClass ? ' ' + cardClass : ''}`;
      card.innerHTML = `
        <div class="turn-command">
          <span class="turn-number">#${turn.sequence}</span>
          <span class="command">${escHtml(turn.command)}</span>
          ${turn.game_turn != null ? `<span class="game-turn-num">T${turn.game_turn}</span>` : ''}
          ${turn.isBlank ? '<span class="result-badge result-blank">BLANK</span>' : ''}
          <span class="result-badge result-${turn.result.toLowerCase()}">${turn.result}</span>
        </div>
        ${turn.output_text ? `<div class="output-block">${escHtml(turn.output_text)}</div>` : '<div class="output-block" style="color:var(--color-amber);font-style:italic">(no output)</div>'}
        ${assertionsHtml}
        <div class="events-toggle">
          <span class="arrow">&#9654;</span>
          <span>Events (${events.length})</span>
          <div class="event-badges-inline">
            ${eventTypes.map(t => `<span class="event-badge-small">${escHtml(t.replace('if.event.', '').replace('game.', 'g:'))}</span>`).join('')}
          </div>
        </div>
        <div class="events-section">
          <div class="events-list"></div>
        </div>
      `;

      const toggle = card.querySelector('.events-toggle');
      const section = card.querySelector('.events-section');
      toggle.addEventListener('click', () => {
        const isOpen = section.classList.toggle('open');
        toggle.classList.toggle('open', isOpen);
        if (isOpen && !section.getAttribute('data-loaded')) {
          renderTurnEvents(turn.id, card.querySelector('.events-list'));
          section.setAttribute('data-loaded', 'true');
        }
      });

      container.appendChild(card);
    }
  }

  function renderTurnEvents(turnId, container) {
    if (!viewerData) return;
    const events = viewerData.eventsByTurn[turnId] || [];
    const filtered = state.eventFilter
      ? events.filter(e => e.event_type === state.eventFilter)
      : events;

    if (filtered.length === 0) {
      container.innerHTML = '<span style="font-size:0.72rem;color:var(--color-muted)">No events</span>';
      return;
    }

    container.innerHTML = '';
    for (const ev of filtered) {
      const cls = classifyEvent(ev.event_type);
      const summary = summarizeEvent(ev);
      const item = document.createElement('div');
      item.className = 'event-item';
      item.innerHTML = `
        <div class="event-header">
          <span class="event-type-badge etype-${cls}">${escHtml(ev.event_type)}</span>
          <span class="event-summary">${escHtml(summary)}</span>
          <span class="event-expand">&#9654;</span>
        </div>
        <div class="event-json"><pre>${highlightJson(ev.data)}</pre></div>
      `;

      const hdr = item.querySelector('.event-header');
      const json = item.querySelector('.event-json');
      const arrow = item.querySelector('.event-expand');
      hdr.addEventListener('click', () => {
        const open = json.classList.toggle('open');
        arrow.style.transform = open ? 'rotate(90deg)' : '';
      });

      container.appendChild(item);
    }
  }

  document.getElementById('filter-event-type').addEventListener('change', (e) => {
    state.eventFilter = e.target.value;
    renderTurns();
  });

  document.getElementById('filter-result').addEventListener('change', (e) => {
    state.resultFilter = e.target.value;
    renderTurns();
  });

  async function init() {
    try {
      const resp = await fetch('walkthrough.json');
      if (resp.ok) {
        const raw = await resp.json();
        viewerData = raw.turnsByTranscript ? raw : transformTestResults(raw);
        renderStats();
        renderTranscripts();
        renderEventTypes();
        return;
      }
    } catch (e) { /* fall through */ }

    document.getElementById('stats').innerHTML = `
      <span style="color: var(--color-text)">
        No walkthrough.json found. Drop a test-results JSON file here, or
        <label style="color: var(--color-accent); cursor: pointer; text-decoration: underline;">
          browse for one
          <input type="file" accept=".json" id="file-input" style="display:none">
        </label>.
        Run <code style="color:var(--color-amber)">npm run walkthrough</code> to generate it.
      </span>
    `;

    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const raw = JSON.parse(text);
      viewerData = raw.turnsByTranscript ? raw : transformTestResults(raw);
      renderStats();
      renderTranscripts();
      renderEventTypes();
    });

    document.body.addEventListener('dragover', (e) => { e.preventDefault(); });
    document.body.addEventListener('drop', async (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (!file) return;
      const text = await file.text();
      const raw = JSON.parse(text);
      viewerData = raw.turnsByTranscript ? raw : transformTestResults(raw);
      renderStats();
      renderTranscripts();
      renderEventTypes();
    });
  }

  init();
</script>
</body>
</html>
